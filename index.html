<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex API</title>
  <script src="js/script.js" defer></script>
</head>

<body>

  <div>
    <p>Consumo Api PokeDex</p>

    <h1>Pokédex</h1>

    <p>Pesquise um Pokemon pelo nome ou numero da Pokedex.</p>

    <div>
      <input type="text" id="campoTexto" placeholder="Ex.: Pikachu ou 25 (SOMENTE NUMERO)">
      <button id="btnConsultar">Pesquisar Pokemon</button>
      <button id="btnLimpar">Limpar</button>
    </div>

    <p>Exemplos para teste: pikachu, charizard, bulbasaur.</p>
    <div id="display"></div>

  </div>
</body>
</html>
